# Local development only. Nothing here is deployed.
#
# No secret is committed: the token and the database password are required from
# the environment, and `docker compose` refuses to start without them. Set them in
# your shell, or in a `.env` file next to this one (git ignores it):
#
#   IMONEY_SHARED_TOKEN=<any value; send it as `Authorization: Bearer <value>`>
#   IMONEY_DB_PASSWORD=<any value>
#
# Both ports listen on 127.0.0.1 only, so nothing else on the network reaches the
# API or the database. The constitution allows real data in this local database.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: imoney
      POSTGRES_USER: imoney
      POSTGRES_PASSWORD: ${IMONEY_DB_PASSWORD:?set IMONEY_DB_PASSWORD in the environment or in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Over TCP (-h 127.0.0.1), the way the API connects. On a fresh volume the image
      # first runs a temporary init server on the Unix socket only, then restarts;
      # checked over the socket, this reported healthy during init, the API connected
      # over TCP in the restart window, and its Development boot failed fast (AC 5a).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U imoney -d imoney"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Reached by the compose service name, not localhost: the API runs in its
      # own container and localhost there is the API itself.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=imoney;Username=imoney;Password=${IMONEY_DB_PASSWORD:?set IMONEY_DB_PASSWORD in the environment or in .env}"
      Auth__SharedToken: ${IMONEY_SHARED_TOKEN:?set IMONEY_SHARED_TOKEN in the environment or in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # A GET, not `wget --spider`: --spider sends HEAD, and /health is documented
      # and mapped as GET only, so HEAD answers 405 and the container never turns
      # healthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
